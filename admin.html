<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Private page: keep out of Google/Bing and every other search engine -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Team Dashboard</title>
<link rel="icon" href="./Images/FCV Favicon.png">
<style>
:root{
  --navy:#0d1b2a; --navy-2:#16283b; --gold:#f3b41e; --gold-d:#b7860b; --sand:#ece7d9; --paper:#f4f1ea;
  --ink:#1f2937; --muted:#6b7280; --line:#e6e1d3; --white:#fff; --red:#b3261e; --green:#2c6e49;
  --font:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; --serif:Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.sr{position:absolute;left:-9999px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.15rem;border:2px solid transparent;border-radius:3px;
  font-weight:700;font-size:.8125rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;line-height:1.1;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn-gold:hover:not(:disabled){background:#ffc437}
.btn-dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-dark:hover:not(:disabled){background:var(--navy-2)}
.btn-ghost{background:#fff;border-color:var(--navy);color:var(--navy)}
.btn-ghost:hover:not(:disabled){background:var(--sand)}
.btn-quiet{background:transparent;border-color:rgba(255,255,255,.35);color:#fff;padding:.5rem .85rem}
.btn-quiet:hover{background:rgba(255,255,255,.1)}
.btn svg{width:1em;height:1em;flex:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
  background:radial-gradient(1200px 600px at 20% -10%,#1d3550 0,transparent 60%),var(--navy)}
.login-card{width:100%;max-width:25rem;background:#fff;padding:2.25rem 2rem 1.75rem;border-radius:4px;border-top:5px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-logo{display:block;width:150px;margin:-.25rem auto 1.25rem;background:var(--navy);padding:.75rem 1rem;border-radius:3px}
.login-card h1{margin:0 0 .35rem;font:400 1.75rem/1.2 var(--serif);color:var(--navy);text-align:center}
.login-card p.sub{margin:0 0 1.5rem;color:var(--muted);text-align:center;font-size:.9375rem}
.login-card label{display:block;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.pw-wrap{position:relative}
.pw-wrap input{width:100%;padding:.8rem 4.5rem .8rem .9rem;border:1.5px solid #cfc9b9;border-radius:3px;background:#fff;font-size:1rem}
.pw-wrap input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(243,180,30,.35)}
.pw-toggle{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--navy);font-size:.8125rem;font-weight:700;padding:.5rem .6rem;cursor:pointer}
.msg{min-height:1.4rem;margin:.75rem 0 .5rem;font-size:.9rem;font-weight:600;color:var(--red)}
.login-card .btn{width:100%;padding:.9rem}
.fine{margin:1.1rem 0 0;font-size:.75rem;color:var(--muted);text-align:center}

/* ---------- app shell ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
.top-in{max-width:80rem;margin:0 auto;padding:.7rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.9rem;min-width:0}
.brand img{height:42px;width:auto;display:block}
.brand span{font:400 1.2rem/1.2 var(--serif);white-space:nowrap}
.top-r{display:flex;align-items:center;gap:.6rem}
.updated{font-size:.75rem;color:#b8c2ce;white-space:nowrap}
.wrap{max-width:80rem;margin:0 auto;padding:1.5rem 1.25rem 4rem}

.tabs{display:flex;gap:.25rem;border-bottom:2px solid var(--line);margin-bottom:1.25rem;overflow-x:auto}
.tab{border:0;background:none;padding:.8rem 1.1rem;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--gold)}
.tab .count{display:inline-block;min-width:1.5rem;padding:.05rem .45rem;margin-left:.4rem;border-radius:99px;background:var(--sand);color:var(--navy);font-size:.75rem;text-align:center}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.25rem}
.stat{background:#fff;border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:4px;padding:.9rem 1.1rem;text-align:left;cursor:pointer;width:100%}
.stat:hover{box-shadow:0 2px 10px rgba(13,27,42,.08)}
.stat.new{border-left-color:var(--gold)} .stat.active{border-left-color:#3b82c4} .stat.won{border-left-color:var(--green)}
.stat .k{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font:400 2rem/1.15 var(--serif);color:var(--navy)}
.stat .s{font-size:.8rem;color:var(--muted);min-height:1.2em}

.toolbar{display:flex;flex-wrap:wrap;gap:.65rem;margin-bottom:1rem}
.toolbar .search{flex:1 1 16rem;position:relative}
.toolbar input,.toolbar select{width:100%;padding:.7rem .9rem;border:1.5px solid #cfc9b9;border-radius:3px;background:#fff}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(243,180,30,.35)}
.toolbar .sel{flex:0 0 12.5rem}

/* ---------- list ---------- */
.list-head,.row{display:grid;gap:.85rem;align-items:center}
.quote-cols{grid-template-columns:2.3fr 1.1fr 1.5fr 1fr 1.25fr 18px}
.contact-cols{grid-template-columns:2.3fr 1.1fr 2.2fr 1.25fr 18px}
.list-head{padding:.4rem 1.1rem;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.row{width:100%;text-align:left;padding:.95rem 1.1rem;margin-bottom:.55rem;background:#fff;border:1px solid var(--line);border-radius:4px;cursor:pointer}
.row:hover{border-color:var(--navy);box-shadow:0 2px 10px rgba(13,27,42,.1)}
.row.is-new{border-left:5px solid var(--gold);padding-left:calc(1.1rem - 4px)}
.c-name b{display:block;color:var(--navy);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name small,.c-date small{display:block;color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-est{font-weight:600} .c-act{font-weight:700;color:var(--navy)} .c-act.none{color:#a1a1aa;font-weight:400}
.c-subj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:10px;height:10px;border-top:2px solid #b4ad98;border-right:2px solid #b4ad98;transform:rotate(45deg);justify-self:end}
.badge{display:inline-block;padding:.22rem .65rem;border-radius:99px;font-size:.75rem;font-weight:700;white-space:nowrap}
.s-New{background:#fdecc0;color:#7a5200} .s-Contacted{background:#dce8f7;color:#1d4373}
.s-Site-Visit-Scheduled{background:#e3daf5;color:#4b2f86} .s-Quote-Sent{background:#d4eef2;color:#0e5560}
.s-Accepted{background:#d5edd9;color:#1f5a33} .s-Declined{background:#f6d8d6;color:#8a2a22} .s-Completed{background:#e4e4e4;color:#444}
.empty{background:#fff;border:1px dashed #cfc9b9;border-radius:4px;padding:2.5rem 1rem;text-align:center;color:var(--muted)}
.loading{padding:3rem 1rem;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:1.1em;height:1.1em;border:3px solid var(--sand);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-.2em;margin-right:.5rem}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- drawer ---------- */
.backdrop{position:fixed;inset:0;background:rgba(13,27,42,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(46rem,100%);background:var(--paper);z-index:50;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.25);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.d-head{background:var(--navy);color:#fff;padding:1.25rem 1.5rem 1.15rem;border-bottom:4px solid var(--gold);display:flex;justify-content:space-between;gap:1rem}
.d-ref{font-size:.78rem;letter-spacing:.06em;color:#b8c2ce}
.d-head h2{margin:.2rem 0 .55rem;font:400 1.75rem/1.2 var(--serif)}
.x{border:0;background:rgba(255,255,255,.12);color:#fff;width:2.4rem;height:2.4rem;border-radius:50%;font-size:1.4rem;line-height:1;cursor:pointer;flex:none}
.x:hover{background:rgba(255,255,255,.25)}
.d-actions{display:flex;flex-wrap:wrap;gap:.6rem;padding:1rem 1.5rem;background:#fff;border-bottom:1px solid var(--line)}
.d-actions .grow{flex:1}
.d-body{flex:1;overflow-y:auto;padding:1.25rem 1.5rem 2rem}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1.1rem 1.25rem;margin-bottom:1rem}
.card h3{margin:0 0 .8rem;padding-bottom:.55rem;border-bottom:2px solid var(--gold);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--navy)}
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.price-grid .k{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.price-grid .v{font:400 1.6rem/1.25 var(--serif);color:var(--navy)}
.price-grid .v.none{font:italic 400 1rem/2 var(--font);color:#9ca3af}
.hint{margin:.8rem 0 0;font-size:.82rem;color:var(--muted)}
.items{list-style:none;margin:0;padding:0}
.items li{position:relative;padding:.3rem 0 .3rem 1.3rem}
.items li:before{content:"";position:absolute;left:0;top:.8em;width:.55rem;height:.55rem;background:var(--gold)}
.items.visit li:before{background:#c2410c}
.sub-h{margin:1rem 0 .3rem;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#c2410c}
.kv{display:grid;grid-template-columns:11rem 1fr;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv dt,.kv dd{margin:0;padding:.55rem 0}
.kv dt{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);padding-top:.7rem}
.kv dd{word-break:break-word}
.kv a{color:var(--navy);font-weight:600}
.text-block{white-space:pre-wrap;word-break:break-word;background:#faf9f5;border-left:4px solid var(--navy);padding:.8rem 1rem}
.text-block.empty-t{color:#9ca3af;font-style:italic;border-left-color:#d6d3c8}
.muted{color:var(--muted)}

/* edit mode */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.8rem 1rem}
.fields .full{grid-column:1/-1}
.fld label{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:.3rem}
.fld input,.fld select,.fld textarea{width:100%;padding:.65rem .75rem;border:1.5px solid #cfc9b9;border-radius:3px;background:#fff}
.fld textarea{min-height:6.5rem;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(243,180,30,.35)}
.fld.changed input,.fld.changed select,.fld.changed textarea{border-color:var(--gold-d);background:#fffaf0}
.money{position:relative}.money span{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--muted)}
.money input{padding-left:1.6rem}
.locked{background:#f3f4f6;border:1px solid var(--line);border-radius:4px;padding:1rem 1.25rem;margin-bottom:1rem}
.locked h3{margin:0 0 .4rem;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d-foot{border-top:1px solid var(--line);background:#fff;padding:.9rem 1.5rem;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem}
.d-foot .msg{margin:0;min-height:0;flex:1 1 12rem}
.d-foot .ok{color:var(--green)}

.toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:.8rem 1.3rem;border-radius:4px;border-left:5px solid var(--gold);
  box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-left-color:#ef4444}

@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .list-head{display:none}
  .row,.quote-cols,.contact-cols{grid-template-columns:1fr auto;grid-template-areas:"name status" "date date" "est est" "act act";gap:.3rem .75rem}
  .contact-cols{grid-template-areas:"name status" "date date" "subj subj"}
  .c-name{grid-area:name;min-width:0}.c-status{grid-area:status}.c-date{grid-area:date}.c-est{grid-area:est}.c-act{grid-area:act}.c-subj{grid-area:subj}
  .c-date small{display:inline;margin-left:.4rem}
  .c-est:before{content:"Online estimate: ";color:var(--muted);font-weight:400}
  .c-act:before{content:"Actual price: ";color:var(--muted);font-weight:400}
  .chev{display:none}
  .price-grid{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr}.kv dt{padding-bottom:0}.kv dd{padding-top:.1rem}
  .fields{grid-template-columns:1fr}
  .updated{display:none}
}
@media (max-width:520px){
  .brand span{display:none}
  .d-actions .btn{flex:1 1 40%}
  .d-actions .grow{display:none}
  .wrap{padding:1rem .8rem 4rem}
}
</style>
</head>
<body>
<noscript><p style="padding:2rem">This dashboard needs JavaScript.</p></noscript>

<!-- ============ SIGN IN ============ -->
<section class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <img class="login-logo" src="./Images/FCV Logo - Dark Mode.png" alt="FCV Restoration &amp; Construction">
    <h1>Team dashboard</h1>
    <p class="sub">Sign in to view and manage quote requests.</p>
    <label for="pw">Password</label>
    <div class="pw-wrap">
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button>
    </div>
    <div class="msg" id="loginMsg" role="alert"></div>
    <button class="btn btn-gold" id="loginBtn" type="submit">Sign in</button>
    <p class="fine">Authorised team members only.</p>
  </form>
</section>

<!-- ============ DASHBOARD ============ -->
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand"><img src="./Images/FCV Logo - Dark Mode.png" alt="FCV"><span>Quote Dashboard</span></div>
      <div class="top-r">
        <span class="updated" id="updated"></span>
        <button class="btn btn-quiet" id="refreshBtn" type="button">Refresh</button>
        <button class="btn btn-quiet" id="signOutBtn" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="tabs" role="tablist" aria-label="Lists">
      <button class="tab" role="tab" data-tab="quote" aria-selected="true">Quote requests <span class="count" id="cntQuote">0</span></button>
      <button class="tab" role="tab" data-tab="contact" aria-selected="false">Contact messages <span class="count" id="cntContact">0</span></button>
    </div>

    <section class="stats" id="stats" aria-label="Summary"></section>

    <section class="toolbar" aria-label="Search and filter">
      <div class="search"><label class="sr" for="q">Search</label><input id="q" type="search" placeholder="Search name, phone, email, city, reference&hellip;" autocomplete="off"></div>
      <div class="sel"><label class="sr" for="fStatus">Status</label><select id="fStatus"></select></div>
      <div class="sel"><label class="sr" for="fSort">Sort</label>
        <select id="fSort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="high">Highest estimate</option><option value="name">Name A&ndash;Z</option></select></div>
    </section>

    <div id="listHead"></div>
    <section id="list" aria-live="polite"></section>
  </main>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';

  /* ==========================================================================
     SETUP: paste the same Web App URL (ends in /exec) that you put in forms.js
     ========================================================================== */
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbzue-DJaMFHPzXlMARjrNjUXORBh2HhdhmbmrKaTR9Nw1WKW1_2ydsr_JQqxZgsi8Tt/exec';

  var COMPANY_NAME = 'FCV Restoration & Construction';
  var COMPANY_PHONE = '(313) 293-2280';
  var SESSION_KEY = 'fcv_admin_session';
  var REFRESH_MS = 120000;

  // never allow this page to be shown inside another site's frame
  try { if (window.top !== window.self) { document.documentElement.style.display = 'none'; window.top.location = window.location; } } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var state = {
    token: null, expiresAt: 0,
    quotes: [], contacts: [], statusOptions: ['New', 'Contacted', 'Site Visit Scheduled', 'Quote Sent', 'Accepted', 'Declined', 'Completed'],
    tab: 'quote', search: '', status: 'all', sort: 'new',
    sel: null, editing: false, draft: null, saving: false, loadedAt: null, loading: false, lastFocus: null
  };

  /* ---------------------------------------------------------------- helpers */
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function toNum(v) { if (v === '' || v === null || v === undefined) return null; var n = typeof v === 'number' ? v : parseFloat(String(v).replace(/[$,\s]/g, '')); return isFinite(n) ? n : null; }
  function money(v) { var n = toNum(v); if (n === null) return ''; return '$' + n.toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
  function telHref(p) { return 'tel:' + String(p || '').replace(/[^\d+]/g, ''); }
  function items(v) { return String(v || '').split(/\s*;\s*/).filter(Boolean); }
  function firstName(n) { return String(n || '').trim().split(/\s+/)[0] || 'there'; }
  function slug(s) { return String(s || '').replace(/[^A-Za-z0-9]+/g, '-'); }
  function badge(s) { s = s || 'New'; return '<span class="badge s-' + esc(slug(s)) + '">' + esc(s) + '</span>'; }
  function dateOf(r) { var d = new Date(r['Submitted At']); return isNaN(d) ? null : d; }
  function fullDate(r) { var d = dateOf(r); return d ? d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''; }
  function ago(r) {
    var d = dateOf(r); if (!d) return ''; var s = (Date.now() - d) / 1000;
    if (s < 60) return 'Just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' hr ago';
    if (s < 172800) return 'Yesterday'; if (s < 604800) return Math.floor(s / 86400) + ' days ago';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
  }
  function estimateText(r) {
    var t = String(r['Estimate Range (shown to customer)'] || '').trim();
    if (t && t !== 'Site visit needed') return t;
    var lo = toNum(r['Estimate Low']), hi = toNum(r['Estimate High']);
    if (lo !== null && hi !== null) return money(lo) + ' - ' + money(hi);
    return t || 'Site visit needed';
  }
  function cur() { return state.tab === 'contact' ? state.contacts : state.quotes; }
  function find(ref) { var a = cur(); for (var i = 0; i < a.length; i++) if (a[i]['Reference'] === ref) return a[i]; return null; }
  function toast(msg, isErr) {
    var t = $('toast'); t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = 'toast' + (isErr ? ' err' : ''); }, isErr ? 6000 : 3200);
  }

  /* -------------------------------------------------------------------- API */
  function configured() { return /^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(ENDPOINT); }

  function api(action, payload) {
    if (!configured()) return Promise.reject(codeErr('not_configured', 'This page is not connected yet. Paste your Apps Script Web App URL into the ENDPOINT line at the top of the script in admin.html.'));
    var body = { action: action, token: state.token };
    Object.keys(payload || {}).forEach(function (k) { body[k] = payload[k]; });
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 45000) : null;
    return fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (timer) clearTimeout(timer);
        if (!d || d.ok !== true) {

      h += '<div class="locked"><h3>Locked: what the customer submitted</h3><div class="muted" style="font-size:.9rem">Estimate shown: <strong style="color:var(--navy)">' + esc(estimateText(r)) + '</strong>. The selected work, estimate and submission time stay as submitted so there is always a record of what they were shown.</div></div>';
    } else {
      h += '<div class="locked"><h3>Locked</h3><div class="muted" style="font-size:.9rem">The original message is kept exactly as it was sent.</div></div>';
    }
    return h + '</div>';
  }
  function editFoot() { return '<div class="d-foot"><button class="btn btn-gold" id="dSave" type="button">Save changes</button><button class="btn btn-ghost" id="dCancel" type="button">Cancel</button><div class="msg" id="saveMsg" role="alert"></div></div>'; }

  function startEdit() { state.editing = true; renderDrawer(); var f = $('f_Quote-Status'); if (f) f.focus(); var b = document.querySelector('.d-body'); if (b) b.scrollTop = 0; }
  function wireEdit() {
    $('dCancel').onclick = function () { if (dirty() && !confirm('Discard your changes?')) return; state.editing = false; renderDrawer(); };
    $('dSave').onclick = save;
    Array.prototype.forEach.call(document.querySelectorAll('[data-f]'), function (el) {
      var h = function () { var wrap = el.closest('.fld'); if (wrap) wrap.classList.toggle('changed', fieldValue(el) !== original(el.getAttribute('data-f'))); };
      el.addEventListener('input', h); el.addEventListener('change', h);
    });
  }
  function fieldValue(el) { return String(el.value || '').trim(); }
  function normPrice(v) { var n = toNum(v); return n === null ? '' : String(Math.round(n * 100) / 100); }
  function collectChanges() {
    var out = {};
    Array.prototype.forEach.call(document.querySelectorAll('[data-f]'), function (el) {
      var h = el.getAttribute('data-f'), now = fieldValue(el), was = original(h);
      if (h === 'Actual Price') { if (now !== '' && toNum(now) === null) { out[h] = now; return; } now = normPrice(now); was = normPrice(was); }
      if (h === 'Notes' || h === 'Internal Notes') { now = now.replace(/\r\n/g, '\n'); was = was.replace(/\r\n/g, '\n'); }
      if (now !== was) out[h] = h === 'Actual Price' ? (now === '' ? '' : Number(now)) : fieldValue(el);
    });
    return out;
  }
  function save() {
    if (state.saving) return;
    var ch = collectChanges(), msg = $('saveMsg'); msg.className = 'msg'; msg.textContent = '';
    if (!Object.keys(ch).length) { msg.textContent = 'No changes to save.'; return; }
    if (ch['Name'] === '') { msg.textContent = 'Name cannot be empty.'; return; }
    if ('Email' in ch && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(ch['Email'])) { msg.textContent = 'Please enter a valid email address.'; return; }
    if ('Actual Price' in ch && ch['Actual Price'] !== '' && typeof ch['Actual Price'] !== 'number') { msg.textContent = 'Enter the actual price as a number, e.g. 12500 or 12500.50.'; return; }
    state.saving = true; var sb = $('dSave'); sb.disabled = true; sb.innerHTML = '<span class="spin" style="border-top-color:var(--navy);border-color:rgba(13,27,42,.2)"></span>Saving'; $('dCancel').disabled = true;
    var ref = state.sel['Reference'];
    api('update', { tab: state.tab, ref: ref, row: state.sel._row, fields: ch }).then(function (d) {
      var arr = cur(); for (var i = 0; i < arr.length; i++) if (arr[i]['Reference'] === ref) { arr[i] = d.record; break; }
      state.sel = d.record; state.editing = false; state.saving = false;
      renderDrawer(); renderAll(); toast('Saved to the sheet');
    }).catch(function (err) {
      state.saving = false;
      if (handleApiError(err)) return;
      var s = $('dSave'); if (s) { s.disabled = false; s.textContent = 'Save changes'; } var c = $('dCancel'); if (c) c.disabled = false;
      var m = $('saveMsg'); if (m) m.textContent = err.message + ' Your changes are still here, so nothing is lost.';
    });
  }

  /* ----------------------------------------------------------------- boot */
  function boot() {
    var saved = null; try { saved = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) {}
    if (saved && saved.t && saved.e > Date.now()) { state.token = saved.t; state.expiresAt = saved.e; showApp(); loadData(false); }
    else { showLogin(configured() ? '' : 'Not connected yet: paste your Apps Script Web App URL into admin.html (ENDPOINT).'); }
  }
  boot();
})();
</script>
